name: Build unsigned IPA (development)

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Xcode project or workspace path (project by default)'
        required: false
        default: 'sing-box.xcodeproj'
      scheme:
        description: 'Scheme to build'
        required: false
        default: '' # empty = auto-detect first scheme
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
      archive-path:
        description: 'Archive output path'
        required: false
        default: './build/Unsigned.xcarchive'
  push:
    branches:
      - dev
  workflow_call: {}

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    env:
      PROJECT: ${{ github.event.inputs.project || github.workflow_call.inputs.project || github.event.inputs.project || 'sing-box.xcodeproj' }}
      SCHEME: ${{ github.event.inputs.scheme || '' }}
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      ARCHIVE_PATH: ${{ github.event.inputs['archive-path'] || './build/Unsigned.xcarchive' }}
      PAYLOAD_DIR: ./build/Payload
      OUTPUT_IPA: ./build/unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print repo & Xcodeproj (repo detected)
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          ls -la
          if [ -d "$PROJECT" ] || [ -f "$PROJECT" ]; then echo "Found project: $PROJECT"; fi

      - name: Install CocoaPods (if Podfile exists)
        if: ${{ always() }}
        run: |
          if [ -f Podfile ]; then
            echo "Podfile found ➜ Installing CocoaPods and pods"
            sudo gem install cocoapods -v '>= 1.11' --no-document || true
            pod install --repo-update
            # if workspace created, point PROJECT to workspace
            if [ -f *.xcworkspace ]; then
              WS=$(ls *.xcworkspace | head -n1)
              echo "Using workspace: $WS"
              echo "PROJECT=$WS" >> $GITHUB_ENV
            fi
          else
            echo "No Podfile found, skipping CocoaPods installation"
          fi

      - name: Resolve Swift packages (if any)
        run: |
          if [ -f Package.swift ]; then
            echo "SwiftPM manifest found ➜ resolving packages"
            swift package resolve || true
          else
            echo "No Package.swift, skipping SPM resolve"
          fi

      - name: Auto-detect scheme (if not provided)
        id: detect-scheme
        run: |
          if [ -n "$SCHEME" ]; then
            echo "Using scheme from input: $SCHEME"
            echo "SCHEME=$SCHEME" >> $GITHUB_ENV
            exit 0
          fi
          echo "No scheme provided — listing schemes from project/workspace..."
          # Use xcodebuild to list schemes; prefer workspace if provided
          LIST_OUTPUT=$(xcodebuild -list -project "$PROJECT" 2>/dev/null || xcodebuild -list -workspace "$PROJECT" 2>/dev/null || true)
          echo "$LIST_OUTPUT"
          SCHEME_NAME=$(echo "$LIST_OUTPUT" | sed -n '/Schemes:/,$p' | tail -n +2 | sed -n '1p' | xargs)
          if [ -z "$SCHEME_NAME" ]; then
            # fallback: try scanning *.xcodeproj for scheme file name
            if ls *.xcodeproj >/dev/null 2>&1; then
              SCHEME_NAME="$(ls *.xcodeproj | sed 's/.xcodeproj//;q')"
            fi
          fi
          if [ -z "$SCHEME_NAME" ]; then
            echo "ERROR: Could not auto-detect scheme. Please set the 'scheme' input."
            exit 1
          fi
          echo "Detected scheme: $SCHEME_NAME"
          echo "SCHEME=$SCHEME_NAME" >> $GITHUB_ENV

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create archive (.xcarchive) with codesigning disabled
        run: |
          set -x
          mkdir -p $(dirname "$ARCHIVE_PATH")
          # We disable signing so the archive contains an unsigned .app
          xcodebuild clean -project "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" || true
          # Try both project and workspace forms (xcodebuild will ignore the wrong one)
          xcodebuild archive \
            -project "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild-archive.log

      - name: Locate .app inside archive
        id: find-app
        run: |
          set -e
          echo "Archive path: $ARCHIVE_PATH"
          # Search for the .app inside the xcarchive Products/Applications directory
          APP_PATH=$(find "${ARCHIVE_PATH}" -type d -name "*.app" | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found under ${ARCHIVE_PATH}/Products/Applications"
            ls -la "${ARCHIVE_PATH}"
            exit 2
          fi
          echo "Found .app: $APP_PATH"
          echo "::set-output name=app_path::$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned .app into Payload/.ipa
        run: |
          set -e
          rm -rf ./build
          mkdir -p "$PAYLOAD_DIR"
          APP_PATH="${APP_PATH:-$APP_PATH}"
          # If APP_PATH was not exported correctly, attempt to re-find
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "${ARCHIVE_PATH}" -type d -name "*.app" | head -n1)
          fi
          cp -R "$APP_PATH" "$PAYLOAD_DIR"/
          pushd ./build
          zip -qry unsigned.ipa Payload
          popd
          if [ ! -f "$OUTPUT_IPA" ]; then
            echo "ERROR: unsigned IPA not created at $OUTPUT_IPA"
            exit 3
          fi
          echo "Unsigned IPA created at: $OUTPUT_IPA"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ./build/unsigned.ipa

      - name: Upload xcode logs (xcodebuild-archive.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: xcodebuild-archive.log
