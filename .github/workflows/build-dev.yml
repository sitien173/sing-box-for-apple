name: Build unsigned IPA (dev) — diagnostics + robust detect

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Optional: .xcodeproj or .xcworkspace (leave empty to auto-detect)'
        required: false
        default: ''
      scheme:
        description: 'Optional: scheme name (leave empty to auto-detect)'
        required: false
        default: ''
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
      archive-path:
        description: 'Archive output path'
        required: false
        default: './build/Unsigned.xcarchive'

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    env:
      DEFAULT_PROJECT: sing-box.xcodeproj
      PAYLOAD_DIR: ./build/Payload
      OUTPUT_IPA: ./build/unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save inputs to env
        run: |
          echo "INPUT_PROJECT=${{ github.event.inputs.project }}" >> $GITHUB_ENV
          echo "INPUT_SCHEME=${{ github.event.inputs.scheme }}" >> $GITHUB_ENV
          echo "CONFIGURATION=${{ github.event.inputs.configuration || 'Release' }}" >> $GITHUB_ENV
          echo "ARCHIVE_PATH=${{ github.event.inputs['archive-path'] || './build/Unsigned.xcarchive' }}" >> $GITHUB_ENV

      # --- Diagnostic steps (safe, quick) ---
      - name: Debug — top-level files
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la

      - name: Debug — recursive (depth 3) file list
        run: |
          find . -maxdepth 3 -print | sed -n '1,500p' > ci-file-list.txt || true

      - name: Debug — xcodebuild -list (workspace & project)
        run: |
          echo "=== xcodebuild -list output ===" > xcodebuild-list.txt || true
          for w in *.xcworkspace; do
            echo "workspace: $w" >> xcodebuild-list.txt
            xcodebuild -list -workspace "$w" >> xcodebuild-list.txt 2>&1 || true
          done
          for p in *.xcodeproj; do
            echo "project: $p" >> xcodebuild-list.txt
            xcodebuild -list -project "$p" >> xcodebuild-list.txt 2>&1 || true
          done
          git -C . log -n1 --pretty=fuller >> xcodebuild-list.txt || true

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug
          path: |
            ci-file-list.txt
            xcodebuild-list.txt

      # --- End diagnostics; now robust detection + build ---
      - name: Install CocoaPods if Podfile present
        run: |
          if [ -f Podfile ]; then
            sudo gem install cocoapods -v '>=1.11' --no-document || true
            pod install --repo-update || true
          fi

      - name: Robust auto-detect project/workspace & scheme
        id: detect
        run: |
          set -euo pipefail
          # project/workspace selection
          if [ -n "${INPUT_PROJECT}" ]; then
            echo "PROJECT=${INPUT_PROJECT}" >> $GITHUB_ENV
          else
            if ls -1 *.xcworkspace 2>/dev/null | grep -q .; then
              WS=$(ls -1 *.xcworkspace | head -n1)
              echo "PROJECT=$WS" >> $GITHUB_ENV
            elif ls -1 *.xcodeproj 2>/dev/null | grep -q .; then
              PJ=$(ls -1 *.xcodeproj | head -n1)
              echo "PROJECT=$PJ" >> $GITHUB_ENV
            else
              echo "PROJECT=${DEFAULT_PROJECT}" >> $GITHUB_ENV
            fi
          fi

          # scheme selection
          if [ -n "${INPUT_SCHEME}" ]; then
            echo "SCHEME=${INPUT_SCHEME}" >> $GITHUB_ENV
            exit 0
          fi

          if [[ "${PROJECT}" == *.xcworkspace ]]; then
            XOUT=$(xcodebuild -list -workspace "${PROJECT}" 2>/dev/null || true)
          else
            XOUT=$(xcodebuild -list -project "${PROJECT}" 2>/dev/null || true)
          fi
          SCHEME_NAME=$(echo "$XOUT" | sed -n '/Schemes:/,$p' | tail -n +2 | sed -n '1p' | xargs || true)
          if [ -n "$SCHEME_NAME" ]; then
            echo "SCHEME=$SCHEME_NAME" >> $GITHUB_ENV
            exit 0
          fi

          # scan shared schemes
          for P in *.xcodeproj *.xcworkspace; do
            if [ -d "$P/xcshareddata/xcschemes" ]; then
              fs=$(ls "$P/xcshareddata/xcschemes"/*.xcscheme 2>/dev/null | head -n1 || true)
              if [ -n "$fs" ]; then
                bn=$(basename "$fs" .xcscheme)
                echo "SCHEME=$bn" >> $GITHUB_ENV
                exit 0
              fi
            fi
          done

          # last resort: project basename
          if [[ "${PROJECT}" == *.xcodeproj ]]; then
            PRJ_BASE=$(basename "${PROJECT}" .xcodeproj)
            echo "SCHEME=$PRJ_BASE" >> $GITHUB_ENV
            exit 0
          fi

          echo "ERROR: could not detect scheme; set 'scheme' input" >&2
          exit 1

      - name: Show Xcode version
        run: xcodebuild -version || true

      - name: Clean
        run: |
          if [[ "${PROJECT}" == *.xcworkspace ]]; then
            xcodebuild clean -workspace "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" || true
          else
            xcodebuild clean -project "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" || true
          fi

      - name: Archive (.xcarchive) with signing disabled
        run: |
          mkdir -p "$(dirname "${ARCHIVE_PATH}")"
          if [[ "${PROJECT}" == *.xcworkspace ]]; then
            xcodebuild archive -workspace "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" -archivePath "${ARCHIVE_PATH}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee xcodebuild-archive.log
          else
            xcodebuild archive -project "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" -archivePath "${ARCHIVE_PATH}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee xcodebuild-archive.log
          fi

      - name: Find .app and package unsigned IPA
        run: |
          APP_PATH=$(find "${ARCHIVE_PATH}" -type d -name "*.app" | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            find "${ARCHIVE_PATH}" -ls || true
            exit 2
          fi
          rm -rf ./build
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "$APP_PATH" "${PAYLOAD_DIR}/"
          pushd ./build
          zip -qry unsigned.ipa Payload
          popd

      - name: Upload artifacts (ipa + logs)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: |
            ./build/unsigned.ipa
            xcodebuild-archive.log
