name: Build unsigned IPA (development)

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Xcode project (.xcodeproj) or workspace (.xcworkspace) path (leave empty to auto-detect)'
        required: false
        default: ''
      scheme:
        description: 'Scheme to build (leave empty to auto-detect)'
        required: false
        default: ''
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
      archive-path:
        description: 'Archive output path'
        required: false
        default: './build/Unsigned.xcarchive'
  push:
    branches:
      - dev
  workflow_call: {}

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    env:
      # default fallbacks (override via workflow_dispatch inputs)
      DEFAULT_PROJECT: sing-box.xcodeproj
      PAYLOAD_DIR: ./build/Payload
      OUTPUT_IPA: ./build/unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Debug — list repo files (top-level)
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Top-level files:"
          ls -la

      - name: Debug — recursive file listing (limited)
        run: |
          echo "Recursive listing (depth 3):"
          find . -maxdepth 3 -type d -print -o -type f -print | sed -n '1,200p' > ci-file-list.txt
          tail -n +1 ci-file-list.txt
        continue-on-error: true

      - name: Debug — xcodebuild -list (project & workspace)
        run: |
          echo "=== xcodebuild -list for .xcworkspace (if any) ===" > xcodebuild-list.txt || true
          for w in *.xcworkspace; do
            echo "workspace: $w" >> xcodebuild-list.txt
            xcodebuild -list -workspace "$w" >> xcodebuild-list.txt 2>&1 || true
          done
          echo "=== xcodebuild -list for .xcodeproj (if any) ===" >> xcodebuild-list.txt
          for p in *.xcodeproj; do
            echo "project: $p" >> xcodebuild-list.txt
            xcodebuild -list -project "$p" >> xcodebuild-list.txt 2>&1 || true
          done
          echo "=== git status & show last commit ===" >> xcodebuild-list.txt
          git status --porcelain >> xcodebuild-list.txt || true
          git -c core.pager= -C . log -n1 --pretty=fuller >> xcodebuild-list.txt || true

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug
          path: |
            ci-file-list.txt
            xcodebuild-list.txt

      - name: Init env from inputs
        run: |
          # prefer explicit inputs; if blank, leave empty for auto-detect
          echo "INPUT_PROJECT=${{ github.event.inputs.project }}" >> $GITHUB_ENV || true
          echo "INPUT_SCHEME=${{ github.event.inputs.scheme }}" >> $GITHUB_ENV || true
          echo "CONFIGURATION=${{ github.event.inputs.configuration || 'Release' }}" >> $GITHUB_ENV
          echo "ARCHIVE_PATH=${{ github.event.inputs['archive-path'] || './build/Unsigned.xcarchive' }}" >> $GITHUB_ENV
          echo "PAYLOAD_DIR=./build/Payload" >> $GITHUB_ENV
          echo "OUTPUT_IPA=./build/unsigned.ipa" >> $GITHUB_ENV

      - name: Print repo root & files (for debugging)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          echo "Top-level .xcodeproj and .xcworkspace:"
          ls -1 *.xcodeproj 2>/dev/null || true
          ls -1 *.xcworkspace 2>/dev/null || true

      - name: Install CocoaPods if Podfile present
        run: |
          if [ -f Podfile ]; then
            echo "Podfile found — installing CocoaPods and pods"
            sudo gem install cocoapods -v '>=1.11' --no-document || true
            pod install --repo-update
          else
            echo "No Podfile detected; skipping CocoaPods"
          fi

      - name: Resolve Swift packages (if Package.swift exists)
        run: |
          if [ -f Package.swift ]; then
            swift package resolve || true
          else
            echo "No Package.swift; skipping SPM resolve"
          fi

      - name: Robust auto-detect project/workspace & scheme
        id: detect
        run: |
          set -euo pipefail
          # If user provided a project/workspace path input, respect it
          if [ -n "${INPUT_PROJECT}" ]; then
            echo "User provided project/workspace: ${INPUT_PROJECT}"
            echo "PROJECT=${INPUT_PROJECT}" >> $GITHUB_ENV
          else
            # prefer workspace if present
            WS_COUNT=$(ls -1 *.xcworkspace 2>/dev/null | wc -l || true)
            if [ "$WS_COUNT" -ge 1 ]; then
              WS=$(ls -1 *.xcworkspace | head -n1)
              echo "Auto-detected workspace: $WS"
              echo "PROJECT=$WS" >> $GITHUB_ENV
            elif ls -1 *.xcodeproj >/dev/null 2>&1; then
              PJ=$(ls -1 *.xcodeproj | head -n1)
              echo "Auto-detected project: $PJ"
              echo "PROJECT=$PJ" >> $GITHUB_ENV
            else
              echo "No .xcworkspace or .xcodeproj found at repo root — will fallback to DEFAULT_PROJECT"
              echo "PROJECT=${DEFAULT_PROJECT}" >> $GITHUB_ENV
            fi
          fi

          # If user provided a scheme, use it
          if [ -n "${INPUT_SCHEME}" ]; then
            echo "User provided scheme: ${INPUT_SCHEME}"
            echo "SCHEME=${INPUT_SCHEME}" >> $GITHUB_ENV
            exit 0
          fi

          # Try xcodebuild -list on workspace or project
          echo "Running xcodebuild -list to find schemes..."
          if [[ "${PROJECT}" == *.xcworkspace ]]; then
            XOUT=$(xcodebuild -list -workspace "${PROJECT}" 2>/dev/null || true)
          else
            XOUT=$(xcodebuild -list -project "${PROJECT}" 2>/dev/null || true)
          fi
          echo "xcodebuild -list output:"
          echo "$XOUT"

          SCHEME_NAME=$(echo "$XOUT" | sed -n '/Schemes:/,$p' | tail -n +2 | sed -n '1p' | xargs || true)
          if [ -n "$SCHEME_NAME" ]; then
            echo "Detected scheme from xcodebuild: $SCHEME_NAME"
            echo "SCHEME=$SCHEME_NAME" >> $GITHUB_ENV
            exit 0
          fi

          # Fallback: scan for shared schemes in xcshareddata/xcschemes inside project/workspace directories
          echo "No schemes from xcodebuild -list — scanning xcshareddata/xcschemes..."
          FOUND=""
          for P in *.xcodeproj *.xcworkspace; do
            if [ -d "$P/xcshareddata/xcschemes" ]; then
              FS=$(ls "$P/xcshareddata/xcschemes"/*.xcscheme 2>/dev/null | head -n1 || true)
              if [ -n "$FS" ]; then
                BN=$(basename "$FS" .xcscheme)
                FOUND="$BN"
                echo "Found scheme file: $FS -> scheme: $BN"
                break
              fi
            fi
          done

          if [ -n "$FOUND" ]; then
            echo "SCHEME=$FOUND" >> $GITHUB_ENV
            exit 0
          fi

          # Last resort: try to infer scheme name from project filename
          if [[ "${PROJECT}" == *.xcodeproj ]]; then
            PRJ_BASE=$(basename "${PROJECT}" .xcodeproj)
            echo "Trying project basename as scheme: $PRJ_BASE"
            echo "SCHEME=$PRJ_BASE" >> $GITHUB_ENV
            exit 0
          fi

          echo "ERROR: Could not auto-detect scheme. Please set 'scheme' input when running the workflow."
          echo "Local commands to list schemes:"
          echo "  xcodebuild -list -project sing-box.xcodeproj"
          echo "  xcodebuild -list -workspace sing-box.xcworkspace"
          exit 1

      - name: Show Xcode version (debug)
        run: xcodebuild -version || true

      - name: Clean (optional)
        run: |
          set -e
          echo "Cleaning build"
          # xcodebuild accepts workspace OR project; pass both forms but one will be ignored
          if [[ "${PROJECT}" == *.xcworkspace ]]; then
            xcodebuild clean -workspace "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" || true
          else
            xcodebuild clean -project "${PROJECT}" -scheme "${SCHEME}" -configuration "${CONFIGURATION}" || true
          fi

      - name: Create archive (.xcarchive) with signing disabled
        run: |
          set -e
          echo "Archiving to ${ARCHIVE_PATH}. Signing disabled."
          mkdir -p "$(dirname "${ARCHIVE_PATH}")"
          if [[ "${PROJECT}" == *.xcworkspace ]]; then
            xcodebuild archive \
              -workspace "${PROJECT}" \
              -scheme "${SCHEME}" \
              -configuration "${CONFIGURATION}" \
              -archivePath "${ARCHIVE_PATH}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              | tee xcodebuild-archive.log
          else
            xcodebuild archive \
              -project "${PROJECT}" \
              -scheme "${SCHEME}" \
              -configuration "${CONFIGURATION}" \
              -archivePath "${ARCHIVE_PATH}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              | tee xcodebuild-archive.log
          fi

      - name: Find .app inside archive
        id: find-app
        run: |
          set -e
          echo "Archive path: ${ARCHIVE_PATH}"
          APP_PATH=$(find "${ARCHIVE_PATH}" -type d -name "*.app" | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found inside archive. Listing archive tree for debugging:"
            find "${ARCHIVE_PATH}" -maxdepth 4 -ls || true
            exit 2
          fi
          echo "Found .app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned .app into Payload/.ipa
        run: |
          set -e
          rm -rf ./build
          mkdir -p "${PAYLOAD_DIR}"
          if [ -z "${APP_PATH:-}" ]; then
            APP_PATH=$(find "${ARCHIVE_PATH}" -type d -name "*.app" | head -n1)
          fi
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/"
          pushd ./build
          zip -qry unsigned.ipa Payload
          popd
          if [ ! -f "${OUTPUT_IPA}" ]; then
            echo "ERROR: unsigned IPA not created at ${OUTPUT_IPA}"
            exit 3
          fi
          echo "Unsigned IPA created at: ${OUTPUT_IPA}"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ./build/unsigned.ipa

      - name: Upload xcode logs (xcodebuild-archive.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: xcodebuild-archive.log
