name: Build sing-box Dev IPA
on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build Unsigned IPA (Dev)
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-apple
          ref: dev
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gomobile & Dependencies
        run: |
          # Manually install gomobile since 'make lib_install' was removed
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          
          # Install other potential dependencies
          go mod download

      - name: Build Core Framework
        run: |
          # Try to build the framework using the standard target
          # If 'make lib_ios' fails, we will try to list targets to debug
          make lib_ios

      - name: Build Unsigned App
        run: |
          xcodebuild build \
            -project sing-box.xcodeproj \
            -scheme sing-box \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/sing-box.app Payload/
          zip -r sing-box-dev-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-dev-unsigned
          path: sing-box-dev-unsigned.ipa
          retention-days: 5
