name: Build Unsigned IPA (Development)

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**. md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

env:
  SCHEME: SFI
  PRODUCT_NAME: sing-box
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Debug' }}

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            . build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Verify Libbox.xcframework exists
        run: |
          if [ ! -d "Libbox.xcframework" ]; then
            echo "⚠️ Libbox.xcframework not found. You may need to build or download it."
            echo "Please ensure the framework is available before building."
            exit 1
          fi
          echo "✅ Libbox. xcframework found"
          ls -la Libbox.xcframework/

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme ${{ env.SCHEME }} \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for iOS (Unsigned)
        run: |
          xcodebuild clean build \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcbeautify --renderer github-actions || true

      - name: Locate built app
        id: locate_app
        run: |
          APP_PATH=$(find DerivedData/Build/Products/${{ env.CONFIGURATION }}-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No . app found in build products"
            find DerivedData -name "*.app" -type d
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          echo "✅ Found app at: $APP_PATH"

      - name: Create Payload directory
        run: |
          mkdir -p Payload
          cp -r "${{ steps.locate_app.outputs. APP_PATH }}" Payload/

      - name: Remove code signature (if any)
        run: |
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + || true
          find Payload -name "*. mobileprovision" -delete || true

      - name: Create unsigned IPA
        run: |
          zip -r "${{ env.PRODUCT_NAME }}-unsigned-${{ env.CONFIGURATION }}.ipa" Payload
          ls -lh *.ipa

      - name: Generate build info
        run: |
          echo "## Build Information" > build-info.md
          echo "" >> build-info.md
          echo "- **Commit:** ${{ github.sha }}" >> build-info.md
          echo "- **Branch:** ${{ github.ref_name }}" >> build-info. md
          echo "- **Configuration:** ${{ env.CONFIGURATION }}" >> build-info.md
          echo "- **Scheme:** ${{ env.SCHEME }}" >> build-info.md
          echo "- **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> build-info.md
          echo "- **Runner OS:** ${{ runner.os }}" >> build-info.md
          echo "- **Xcode Version:** $(xcodebuild -version | head -1)" >> build-info.md
          cat build-info.md

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env. PRODUCT_NAME }}-unsigned-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            ${{ env.PRODUCT_NAME }}-unsigned-${{ env. CONFIGURATION }}.ipa
            build-info.md
          retention-days: 30
          if-no-files-found: error

      - name: Upload dSYMs (Debug Symbols)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }}-dSYMs-${{ github.sha }}
          path: DerivedData/Build/Products/${{ env.CONFIGURATION }}-iphoneos/*. dSYM
          retention-days: 30
          if-no-files-found: ignore

  notify:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Build Status Summary
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "## ✅ Build Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The unsigned IPA has been built successfully and is available as an artifact." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1.  Download the artifact from the Actions tab" >> $GITHUB_STEP_SUMMARY
            echo "2. Use a signing tool (like iOS App Signer) or sign with your own certificate" >> $GITHUB_STEP_SUMMARY
            echo "3. Install via AltStore, Sideloadly, or similar tools" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the build logs for more details." >> $GITHUB_STEP_SUMMARY
          fi
