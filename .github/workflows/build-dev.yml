name: Build Unsigned IPA (Dev)

on:
  push:
    branches:
      - dev
      - develop
      - main
  pull_request:
    branches:
      - dev
      - develop
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      
      - name: Install Dependencies
        run: |
          # Install CocoaPods if Podfile exists
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install
          fi
          
          # Install gomobile for building Libbox.xcframework
          echo "Installing gomobile..."
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          # Initialize gomobile
          $(go env GOPATH)/bin/gomobile init
          
          # Swift Package Manager dependencies (handled by Xcode)
          echo "Swift Package Manager dependencies will be resolved by Xcode"
      
      - name: Build Libbox.xcframework
        run: |
          echo "Building Libbox.xcframework..."
          
          # Check if there's a Makefile with lib or lib_ios target
          if [ -f "Makefile" ]; then
            echo "Makefile found, checking for build targets..."
            
            if grep -q "^lib:" Makefile || grep -q "^lib_ios:" Makefile; then
              echo "Using Makefile to build Libbox..."
              make lib 2>/dev/null || make lib_ios 2>/dev/null || {
                echo "Makefile targets failed, trying manual build..."
                USE_MANUAL=true
              }
            else
              echo "No lib target found in Makefile"
              USE_MANUAL=true
            fi
          else
            echo "No Makefile found"
            USE_MANUAL=true
          fi
          
          # If Makefile approach didn't work, build manually
          if [ "$USE_MANUAL" = "true" ]; then
            echo "Building libbox manually from sing-box repository..."
            
            # Create a temporary directory for the build
            mkdir -p /tmp/sing-box-build
            cd /tmp/sing-box-build
            
            # Clone sing-box repository
            echo "Cloning sing-box repository..."
            git clone --depth 1 https://github.com/SagerNet/sing-box.git
            cd sing-box
            
            # Try using gomobile bind directly (most reliable method)
            echo "Using gomobile bind to build libbox..."
            
            # Initialize gomobile
            echo "Initializing gomobile..."
            $(go env GOPATH)/bin/gomobile init
            
            # Build for iOS using gomobile bind
            echo "Building libbox.xcframework for iOS..."
            $(go env GOPATH)/bin/gomobile bind \
              -target=ios \
              -ldflags="-s -w" \
              -o Libbox.xcframework \
              github.com/sagernet/sing-box/experimental/libbox || {
              echo "❌ Error: gomobile bind failed"
              echo "Trying alternative build method..."
              
              # Fallback: try build_libbox if it exists
              if [ -f "cmd/internal/build_libbox/main.go" ]; then
                echo "Attempting build_libbox tool..."
                go run ./cmd/internal/build_libbox -target ios 2>&1 || {
                  echo "❌ Error: build_libbox also failed"
                  exit 1
                }
              else
                echo "❌ Error: No alternative build method available"
                exit 1
              fi
            }
            
            # Copy the built framework back to the project
            if [ -d "Libbox.xcframework" ]; then
              echo "Copying Libbox.xcframework to workspace..."
              cp -r Libbox.xcframework $GITHUB_WORKSPACE/
              cd $GITHUB_WORKSPACE
            else
              echo "❌ Error: Libbox.xcframework was not created after build"
              ls -la
              exit 1
            fi
          fi
          
          # Verify the framework exists in the workspace
          if [ -d "Libbox.xcframework" ]; then
            echo "✅ Libbox.xcframework built successfully"
            ls -la Libbox.xcframework
          else
            echo "❌ Error: Libbox.xcframework was not found in workspace"
            exit 1
          fi
      
      - name: Display Xcode Version
        run: |
          xcodebuild -version
          swift --version
      
      - name: List Repository Contents
        run: |
          echo "=== Root Directory Contents ==="
          ls -la
          echo ""
          echo "=== Looking for Xcode projects ==="
          find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace"
      
      - name: List Available Schemes
        run: |
          if compgen -G "*.xcworkspace" > /dev/null; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
            echo "Found workspace: $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -list
          elif compgen -G "*.xcodeproj" > /dev/null; then
            PROJECT=$(ls -d *.xcodeproj | head -n 1)
            echo "Found project: $PROJECT"
            xcodebuild -project "$PROJECT" -list
          else
            echo "No Xcode workspace or project found in root directory"
            echo "Searching subdirectories..."
            find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace"
          fi
      
      - name: Build iOS App (Unsigned)
        run: |
          # Determine if using workspace or project
          if compgen -G "*.xcworkspace" > /dev/null; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
            BUILD_CMD="-workspace $WORKSPACE"
            echo "Using workspace: $WORKSPACE"
          elif compgen -G "*.xcodeproj" > /dev/null; then
            PROJECT=$(ls -d *.xcodeproj | head -n 1)
            BUILD_CMD="-project $PROJECT"
            echo "Using project: $PROJECT"
          else
            echo "Error: No .xcworkspace or .xcodeproj found"
            exit 1
          fi
          
          # Build the app for iOS
          # Note: Replace "SFI" with the actual scheme name from your project
          xcodebuild clean build \
            $BUILD_CMD \
            -scheme "SFI" \
            -sdk iphoneos \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath ./build
      
      - name: Create IPA from .app
        run: |
          # Find the .app bundle
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found"
            echo "Searching in build directory..."
            find ./build -type d -name "*.app"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create Payload directory
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Create IPA
          zip -r unsigned.ipa Payload
          
          # Clean up
          rm -rf Payload
          
          # Display IPA info
          ls -lh unsigned.ipa
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-dev-${{ github.sha }}
          path: unsigned.ipa
          retention-days: 30
      
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: ./build/Logs
          retention-days: 7
      
      - name: Build Summary
        if: success()
        run: |
          echo "## Build Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **IPA Size:** $(du -h unsigned.ipa | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "The unsigned IPA is available as an artifact in this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** This is an unsigned build for development purposes only." >> $GITHUB_STEP_SUMMARY
