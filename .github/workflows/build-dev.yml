name: Build Unsigned IPA (Dev)

on:
  push:
    branches:
      - dev
      - develop
      - main
  pull_request:
    branches:
      - dev
      - develop
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Install Dependencies
        run: |
          # Install CocoaPods if Podfile exists
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install
          fi
          
          echo "Dependencies check complete"
      
      - name: Download Pre-built Libbox.xcframework
        run: |
          echo "Downloading pre-built Libbox.xcframework..."
          
          # Get the latest sing-box release
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Latest release: $LATEST_RELEASE"
          
          # Download the iOS framework asset
          FRAMEWORK_URL="https://github.com/SagerNet/sing-box/releases/download/${LATEST_RELEASE}/sing-box-${LATEST_RELEASE#v}-ios.tar.gz"
          echo "Downloading from: $FRAMEWORK_URL"
          
          curl -L -o libbox-ios.tar.gz "$FRAMEWORK_URL" || {
            echo "Failed to download from releases, trying alternative sources..."
            
            # Try a few recent versions as fallback
            for VERSION in "1.10.7" "1.10.6" "1.10.5" "1.10.0" "1.9.7"; do
              echo "Trying version $VERSION..."
              FRAMEWORK_URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-ios.tar.gz"
              if curl -L -f -o libbox-ios.tar.gz "$FRAMEWORK_URL"; then
                echo "Successfully downloaded version $VERSION"
                break
              fi
            done
          }
          
          # Extract the framework
          echo "Extracting framework..."
          tar -xzf libbox-ios.tar.gz
          
          # Find and rename the framework
          if [ -d "Libbox.xcframework" ]; then
            echo "✅ Libbox.xcframework found"
          elif [ -d "libbox.xcframework" ]; then
            mv libbox.xcframework Libbox.xcframework
            echo "✅ Renamed libbox.xcframework to Libbox.xcframework"
          else
            echo "Searching for framework in extracted files..."
            find . -name "*.xcframework" -type d
            FRAMEWORK=$(find . -name "*.xcframework" -type d | head -n 1)
            if [ -n "$FRAMEWORK" ]; then
              mv "$FRAMEWORK" Libbox.xcframework
              echo "✅ Found and renamed framework to Libbox.xcframework"
            else
              echo "❌ Error: No xcframework found in the archive"
              echo "Archive contents:"
              ls -la
              exit 1
            fi
          fi
          
          # Verify the framework
          if [ -d "Libbox.xcframework" ]; then
            echo "✅ Libbox.xcframework ready"
            ls -la Libbox.xcframework
          else
            echo "❌ Error: Libbox.xcframework not found after extraction"
            exit 1
          fi
      
      - name: Display Xcode Version
        run: |
          xcodebuild -version
          swift --version
      
      - name: List Repository Contents
        run: |
          echo "=== Root Directory Contents ==="
          ls -la
          echo ""
          echo "=== Looking for Xcode projects ==="
          find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace"
      
      - name: List Available Schemes
        run: |
          if compgen -G "*.xcworkspace" > /dev/null; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
            echo "Found workspace: $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -list
          elif compgen -G "*.xcodeproj" > /dev/null; then
            PROJECT=$(ls -d *.xcodeproj | head -n 1)
            echo "Found project: $PROJECT"
            xcodebuild -project "$PROJECT" -list
          else
            echo "No Xcode workspace or project found in root directory"
            echo "Searching subdirectories..."
            find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace"
          fi
      
      - name: Build iOS App (Unsigned)
        run: |
          # Determine if using workspace or project
          if compgen -G "*.xcworkspace" > /dev/null; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
            BUILD_CMD="-workspace $WORKSPACE"
            echo "Using workspace: $WORKSPACE"
          elif compgen -G "*.xcodeproj" > /dev/null; then
            PROJECT=$(ls -d *.xcodeproj | head -n 1)
            BUILD_CMD="-project $PROJECT"
            echo "Using project: $PROJECT"
          else
            echo "Error: No .xcworkspace or .xcodeproj found"
            exit 1
          fi
          
          # Build the app for iOS
          # Note: Replace "SFI" with the actual scheme name from your project
          xcodebuild clean build \
            $BUILD_CMD \
            -scheme "SFI" \
            -sdk iphoneos \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath ./build
      
      - name: Create IPA from .app
        run: |
          # Find the .app bundle
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found"
            echo "Searching in build directory..."
            find ./build -type d -name "*.app"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create Payload directory
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Create IPA
          zip -r unsigned.ipa Payload
          
          # Clean up
          rm -rf Payload
          
          # Display IPA info
          ls -lh unsigned.ipa
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-dev-${{ github.sha }}
          path: unsigned.ipa
          retention-days: 30
      
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: ./build/Logs
          retention-days: 7
      
      - name: Build Summary
        if: success()
        run: |
          echo "## Build Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **IPA Size:** $(du -h unsigned.ipa | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "The unsigned IPA is available as an artifact in this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** This is an unsigned build for development purposes only." >> $GITHUB_STEP_SUMMARY
