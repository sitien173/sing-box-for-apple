name: Build Unsigned IPA (Development)

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      libbox_version:
        description: 'Libbox version (e.g., 1.10.0-beta.5 or latest)'
        required: true
        default: 'latest'
        type: string

env:
  SCHEME: SFI
  PRODUCT_NAME: sing-box
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Debug' }}
  LIBBOX_VERSION: ${{ github.event.inputs.libbox_version || 'latest' }}

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: |
          brew install xcbeautify jq

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Libbox.xcframework
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: Libbox.xcframework
          key: libbox-${{ env.LIBBOX_VERSION }}-${{ runner.os }}

      - name: Download Libbox.xcframework
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          echo "📦 Downloading Libbox.xcframework..."

          if [ "${{ env.LIBBOX_VERSION }}" == "latest" ]; then
            # Get the latest release that contains Libbox.xcframework
            echo "🔍 Finding latest release with Libbox.xcframework..."

            RELEASES=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases")

            # Find the first release that has Libbox.xcframework.zip asset
            DOWNLOAD_URL=$(echo "$RELEASES" | jq -r '
              [.[] | select(.assets[]?.name == "Libbox.xcframework.zip")]
              | first
              | .assets[]
              | select(.name == "Libbox.xcframework.zip")
              | .browser_download_url
            ')

            VERSION=$(echo "$RELEASES" | jq -r '
              [.[] | select(.assets[]?.name == "Libbox.xcframework.zip")]
              | first
              | .tag_name
            ')
          else
            # Get specific version
            VERSION="${{ env.LIBBOX_VERSION }}"
            # Add 'v' prefix if not already present
            [[ "$VERSION" != v* ]] && VERSION="v${VERSION}"
            DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/${VERSION}/Libbox.xcframework.zip"
          fi

          echo "📥 Download URL: $DOWNLOAD_URL"
          echo "📌 Version: $VERSION"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "❌ Could not find Libbox.xcframework download URL"
            echo ""
            echo "Available releases with Libbox.xcframework:"
            curl -s "https://api.github.com/repos/SagerNet/sing-box/releases" | jq -r '.[] | select(.assets[]?.name == "Libbox.xcframework.zip") | "\(.tag_name): \(.html_url)"' | head -10
            echo ""
            echo "❌ ERROR: Libbox.xcframework not available for the specified version"
            echo "Please use one of the available versions listed above or 'latest'"
            exit 1
          else
            echo "⬇️ Downloading Libbox.xcframework..."
            if ! curl -L -f -o Libbox.xcframework.zip "$DOWNLOAD_URL"; then
              echo "❌ Failed to download Libbox.xcframework"
              exit 1
            fi

            echo "📂 Extracting..."
            unzip -o Libbox.xcframework.zip
            rm -f Libbox.xcframework.zip
          fi

          echo "✅ Libbox.xcframework ready"
          ls -la Libbox.xcframework/

      - name: Verify Libbox.xcframework
        run: |
          if [ ! -d "Libbox.xcframework" ]; then
            echo "❌ Libbox.xcframework not found"
            exit 1
          fi
          echo "✅ Libbox.xcframework verified"
          echo "📂 Framework contents:"
          ls -la Libbox.xcframework/

          # Show supported architectures
          echo "📱 Supported platforms:"
          find Libbox.xcframework -type d -name "*.framework" | head -5

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme ${{ env.SCHEME }} \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for iOS (Unsigned)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcbeautify --renderer github-actions

          # Check if build succeeded
          if [ ! -d "DerivedData/Build/Products/${{ env.CONFIGURATION }}-iphoneos" ]; then
            echo "❌ Build failed - no products directory found"
            exit 1
          fi

      - name: Locate built app
        id: locate_app
        run: |
          APP_PATH=$(find DerivedData/Build/Products/${{ env.CONFIGURATION }}-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in build products"
            echo "📂 Available build products:"
            find DerivedData -name "*.app" -type d
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          echo "✅ Found app at: $APP_PATH"

      - name: Create Payload directory
        run: |
          mkdir -p Payload
          cp -r "${{ steps.locate_app.outputs.APP_PATH }}" Payload/

      - name: Remove code signature (if any)
        run: |
          echo "🔓 Removing code signatures..."
          # Remove code signature directory
          if find Payload -name "_CodeSignature" -type d -print0 | xargs -0 rm -rf; then
            echo "✅ Removed _CodeSignature directories"
          fi
          # Remove provisioning profiles
          PROFILES_FOUND=$(find Payload -name "*.mobileprovision" -o -name "embedded.mobileprovision")
          if [ -n "$PROFILES_FOUND" ]; then
            echo "Found provisioning profiles:"
            echo "$PROFILES_FOUND"
            find Payload \( -name "*.mobileprovision" -o -name "embedded.mobileprovision" \) -delete
            echo "✅ Removed provisioning profiles"
          else
            echo "✅ No provisioning profiles found"
          fi

      - name: Create unsigned IPA
        run: |
          zip -r "${{ env.PRODUCT_NAME }}-unsigned-${{ env.CONFIGURATION }}.ipa" Payload
          echo "📦 IPA created:"
          ls -lh *.ipa

      - name: Generate build info
        run: |
          cat << EOF > build-info.md
          ## Build Information

          | Property | Value |
          |----------|-------|
          | **Commit** | ${{ github.sha }} |
          | **Branch** | ${{ github.ref_name }} |
          | **Configuration** | ${{ env.CONFIGURATION }} |
          | **Scheme** | ${{ env.SCHEME }} |
          | **Build Date** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | **Runner OS** | ${{ runner.os }} |
          | **Xcode Version** | $(xcodebuild -version | head -1) |
          | **Libbox Version** | ${{ env.LIBBOX_VERSION }} |

          ## Installation

          This is an **unsigned IPA** for development purposes. To install:

          1. **AltStore**: Import the IPA file into AltStore
          2. **Sideloadly**: Use Sideloadly to sign and install
          3. **iOS App Signer**: Sign with your own certificate first
          4. **TrollStore** (if available): Direct installation without signing

          ## Notes

          - This IPA is not signed and cannot be installed directly
          - You need a valid Apple Developer certificate to sign it
          - Free developer accounts have a 7-day expiration for sideloaded apps
          EOF

          cat build-info.md

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }}-unsigned-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            ${{ env.PRODUCT_NAME }}-unsigned-${{ env.CONFIGURATION }}.ipa
            build-info.md
          retention-days: 30
          if-no-files-found: error

      - name: Upload dSYMs (Debug Symbols)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }}-dSYMs-${{ github.sha }}
          path: DerivedData/Build/Products/${{ env.CONFIGURATION }}-iphoneos/*.dSYM
          retention-days: 30
          if-no-files-found: ignore

  notify:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Build Status Summary
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            cat << EOF >> $GITHUB_STEP_SUMMARY
          ## ✅ Build Succeeded

          The unsigned IPA has been built successfully and is available as an artifact.

          ### 📥 Download

          Go to the **Actions** tab → Select this run → **Artifacts** section

          ### 📱 Next Steps

          1. Download the artifact ZIP file
          2. Extract the IPA file
          3. Use one of these methods to install:
             - **AltStore** - Import IPA directly
             - **Sideloadly** - Sign and install in one step
             - **iOS App Signer** - Sign manually, then install via Xcode/Finder
             - **TrollStore** - Direct install (jailbroken/TrollStore devices)
          EOF
          else
            cat << EOF >> $GITHUB_STEP_SUMMARY
          ## ❌ Build Failed

          Please check the build logs for more details.

          ### Common Issues

          1. **Libbox.xcframework not found** - Check if the download URL is correct
          2. **Swift package resolution failed** - Try clearing the cache
          3. **Code signing errors** - Ensure all signing is disabled
          4. **Missing dependencies** - Check submodules are checked out
          EOF
          fi
